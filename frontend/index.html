<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <meta
      name="description"
      content="A real-time chat app built with React, TanStack Query, and Socket.IO."
    />
    <title>Relay — real-time chat</title>
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong palette.
      (() => {
        try {
          const stored = localStorage.getItem('relay-theme');
          const dark = stored ? stored === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
